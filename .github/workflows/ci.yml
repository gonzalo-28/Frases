name: CI

# Run on every push and every pull request, for every branch.
on: [push, pull_request]

jobs:
  check:
    name: Tests, build and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins. It fails if the
      # lockfile and package.json disagree, which catches a forgotten install.
      - run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck and production build
        run: npm run build

      - name: Lint
        run: npm run lint
